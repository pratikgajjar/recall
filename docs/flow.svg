<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" width="960" height="476" role="img" aria-labelledby="t d">
<title id="t">How recall works</title>
<desc id="d">recall index reads new lines from pi, Claude Code, Codex, Cursor and Lua plugin sources into a local SQLite FTS5 index. recall find searches the index. recall show reads the full session again from its source.</desc>
<style>@media (prefers-reduced-motion: reduce) { .dot { display: none } }</style>
