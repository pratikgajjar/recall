<text x="24" y="342" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5">recall does all of the I/O: it walks files, reads only new lines, and stores the checkpoint.</text>
<text x="24" y="362" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5">The built-in Go adapters for pi, Claude Code, Codex and Cursor make the same contract. recall memory and recall skill are Lua plugins.</text>
<text x="480" y="412" text-anchor="middle" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" opacity="0">1. recall reads the bytes and keeps the checkpoint
  <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
    values="0;0;1;1;0;0" keyTimes="0.000;0.000;0.020;0.400;0.420;1.000"/>
</text>
<text x="480" y="412" text-anchor="middle" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" opacity="0">2. the plugin changes the bytes into sessions and messages
  <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
    values="0;0;1;1;0;0" keyTimes="0.000;0.420;0.440;0.600;0.620;1.000"/>
</text>
<text x="480" y="412" text-anchor="middle" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" opacity="0">3. every source gets the same BM25 index and the same commands
  <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
