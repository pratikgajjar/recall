<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="960" height="436" role="img" aria-labelledby="t d">
<title id="t">Index anything: one contract, BM25 search for each source</title>
<desc id="d">A Lua plugin of kind line, file or kv changes JSONL, Markdown or SQLite bytes into sessions and messages. recall does all I/O and gives every source incremental scans, BM25 search, show, related, tags, facets, stats and JSON output.</desc>
