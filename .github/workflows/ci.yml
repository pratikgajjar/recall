name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

      # Lua plugin tier: all plugins/*.lua load + validate, every kind
      # (line/file/kv) reaches parity with its Go adapter, and the kv
      # watermark resume holds. Re-run the Lua suite with more property
      # iterations for wider input coverage on the parity-fragile bits.
      # (Live tests gated by RECALL_LIVE_* stay skipped — CI has no real
      # Cursor DB.)
      - name: lua plugin tests
        run: go test -race -run 'TestLua|TestCursor|TestKeyRange|TestIDFromRelatedKey|TestAllShippedPlugins|TestDiscoverSkipsBrokenPlugin|TestBrokenPluginContained' ./...
        env:
          RECALL_PROP_ITER: "300"
