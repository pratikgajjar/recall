name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest Go 1.26 patch, not the minimum in go.mod. Dependencies
          # need `go 1.26.0` there, and setup-go installs a version with a
          # patch number exactly: releases would ship 1.26.0's stdlib bugs.
          go-version: "1.26"
          check-latest: true
          cache: true

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # Pinned: GoReleaser 2.20.0 writes `zap :not_required` into the cask,
          # and Homebrew 6.0.12 refuses to load it (v0.9.0 broke `brew upgrade`).
          # Unpin when Homebrew accepts that stanza.
          version: "v2.19.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # npm publishing lives in publish-npm.yml (npm OIDC trusted publisher is
      # bound to that workflow file).
