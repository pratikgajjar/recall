name: publish-npm

# Publishes @pratikgajjar/pi-recall to npm.
# Triggered by tags of the form pi-recall-vX.Y.Z (keeps the CLI's v* tags
# separate). Uses npm Trusted Publishers (OIDC) — no long-lived NPM_TOKEN.

on:
  push:
    tags:
      - "pi-recall-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required by npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: npm install --no-fund --no-audit

      - run: npm run --workspace=@pratikgajjar/pi-recall typecheck

      - run: npm publish --workspace=@pratikgajjar/pi-recall --provenance --access public
